services:
  - type: web
    name: smriti-os
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_demo_archive.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKBOARD_API_KEY
        sync: false
      - key: TINKER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

